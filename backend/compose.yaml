services:
  postgres:
    image: 'pgvector/pgvector:pg16'
    environment:
      - 'POSTGRES_DB=concierge'
      - 'POSTGRES_PASSWORD=concierge'
      - 'POSTGRES_USER=concierge'
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U concierge -d concierge']
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: 'ollama/ollama:latest'
    ports:
      - '11434:11434'
    volumes:
      - ollama-data:/root/.ollama

volumes:
  pgdata:
  ollama-data:
