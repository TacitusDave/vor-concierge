spring:
  application:
    name: knowledge-concierge
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:concierge}
    username: ${DB_USER:concierge}
    password: ${DB_PASSWORD:concierge}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

concierge:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY:}
    public-key-path: ${JWT_PUBLIC_KEY:}
    generated-key-path: ${JWT_GENERATED_KEY_PATH:./data/jwt}
    cookie-name: AUTH_TOKEN
    expiration-hours: 24
    cookie-secure: ${COOKIE_SECURE:true}
  bootstrap:
    admin-username: ${ADMIN_USERNAME:admin}
    admin-email: ${ADMIN_EMAIL:admin@vor-concierge.local}
    admin-password: ${ADMIN_PASSWORD:}
    # Seeds one real organization on the Enterprise plan with a full-capability Owner account, so
    # every real feature can be exercised end-to-end during development without Stripe wired up
    # yet. Set CREATE_TEST_ORG=false before a real launch.
    create-test-org: ${CREATE_TEST_ORG:true}
    test-org-name: ${TEST_ORG_NAME:VOR Test Organization}
    test-org-slug: ${TEST_ORG_SLUG:vor-test}
    test-admin-email: ${TEST_ADMIN_EMAIL:owner@vor-test.local}
    test-admin-password: ${TEST_ADMIN_PASSWORD:}
  ollama:
    base-url: ${OLLAMA_URL:http://localhost:11434}
    llm-model: ${OLLAMA_LLM_MODEL:llama3.1}
    embedding-model: ${OLLAMA_EMBED_MODEL:mxbai-embed-large}
    embedding-dimension: ${EMBEDDING_DIMENSION:1024}
  storage:
    type: ${STORAGE_TYPE:local}
    local-path: ${STORAGE_LOCAL_PATH:./data/documents}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:documents}
  chunker:
    max-tokens: 300
    overlap-tokens: 50
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000}
